name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check version and master ancestry
        id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a version tag in the form vX.Y.Z."
            exit 1
          fi
          git fetch origin master
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/master; then
            echo "::error::The tagged commit must belong to master."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.rid }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v6
        
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      
      - name: Run all tests before publishing
        run: dotnet test QRLab.sln --configuration Release
      
      - name: Publish portable single-file application
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RID: ${{ matrix.rid }}
        shell: bash
        run: |
          dotnet publish QRLab.View/QRLab.View.csproj \
            --configuration Release --runtime "$RID" --self-contained true \
            -p:Version="$VERSION" \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false \
            --output artifacts/publish
      
      - name: Prepare release executable
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RID: ${{ matrix.rid }}
        run: |
          extension=""
          if [[ "$RID" == win-* ]]; then
            extension=".exe"
          fi
          executable="artifacts/publish/QRLab$extension"
          test -f "$executable"
 
          # Native packages may copy debug symbols even when DebugSymbols=false.
          find artifacts/publish -type f -name '*.pdb' -delete
          if [[ "$(find artifacts/publish -type f | wc -l)" -ne 1 ]]; then
            echo "::error::Expected exactly one portable executable in the publish directory."
            find artifacts/publish -type f
            exit 1
          fi
          mkdir -p artifacts/release
          filename="QRLab-$TAG-$RID$extension"
          mv "$executable" "artifacts/release/$filename"
  
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Create release and upload executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/* --verify-tag --title "$TAG" --generate-notes
